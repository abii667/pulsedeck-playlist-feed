name: Build playlist feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: playlist-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run validate

      - run: npm run generate
        env:
          SPOTIFY_MARKET: US

      - run: npm run check:data

      - name: Commit generated JSON
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update playlist feed"
            for attempt in 1 2 3; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              git fetch origin "$GITHUB_REF_NAME"
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
                exit 0
              fi
              if [ "$(git rev-parse HEAD^)" != "$(git rev-parse FETCH_HEAD)" ]; then
                echo "Remote changed during generation; aborting so the next run rebuilds from the new source." >&2
                exit 1
              fi
              sleep $((attempt * 2))
            done
            echo "Push failed after 3 attempts." >&2
            exit 1
          fi
